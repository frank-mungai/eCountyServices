spring.application.name=eCountyServices

server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60

# Account security
app.security.max-failed-attempts=5
app.security.lock-minutes=15

# Uploads
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# First admin account
app.admin.id-number=${ADMIN_ID:ADMIN001}
app.admin.full-name=${ADMIN_FULL_NAME:System Administrator}
app.admin.email=${ADMIN_EMAIL}
app.admin.phone=${ADMIN_PHONE}
app.admin.password=${ADMIN_PASSWORD}
# Gmail SMTP
# Email (Resend HTTP API)
resend.api-key=${RESEND_API_KEY:}
mail.from=${MAIL_FROM:onboarding@resend.dev}

# Frontend URL used in activation emails
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Frontend CORS configuration
# Supports comma-separated origins through SecurityConfig.java.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
