spring.application.name=eCountyServices

server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT configuration
app.jwt.secret=${JWT_SECRET:lblJIFLPe6TMAp8BrwLPb18Jt94FnuxKvAnoYZYWo0Ua1RgJnQCIdma0VTHtaGLA}
app.jwt.expiration-minutes=60

# Account security
app.security.max-failed-attempts=5
app.security.lock-minutes=15

# Uploads
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# First admin account
app.admin.id-number=${ADMIN_ID:ADMIN001}
app.admin.full-name=${ADMIN_FULL_NAME:System Administrator}
app.admin.email=${ADMIN_EMAIL:admin@ecounty.go.ke}
app.admin.phone=${ADMIN_PHONE:+254700000000}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Frontend URL used in activation emails
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Frontend CORS configuration
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Technician activation
app.technician-activation.expiry-hours=24
